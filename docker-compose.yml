services:
  postgres:
    container_name: pmp-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pmp_practice}
      POSTGRES_USER: ${POSTGRES_USER:-pmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pmp_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pmp} -d ${POSTGRES_DB:-pmp_practice}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    container_name: pmp-web
    build: .
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pmp}:${POSTGRES_PASSWORD:-pmp_password}@postgres:5432/${POSTGRES_DB:-pmp_practice}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-long-random-string}
      FIRST_ADMIN_USERNAME: ${FIRST_ADMIN_USERNAME:-remy}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:-change-me-now}
      FIRST_ADMIN_DISPLAY_NAME: ${FIRST_ADMIN_DISPLAY_NAME:-Remy}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
